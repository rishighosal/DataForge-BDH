name: deploy page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the single-file page
        run: npm run build

      # dist/index.html is self-contained apart from the Google Fonts stylesheet,
      # so the whole site is that one file plus the docs the page links to.
      - name: Assemble the site
        run: |
          mkdir -p _site/docs
          cp dist/index.html _site/index.html
          cp -r docs/*.md docs/*.pdf _site/docs/ 2>/dev/null || true
          cp results/experiments.json _site/experiments.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
